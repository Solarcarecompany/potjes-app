<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17343B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potjes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Potjes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#17343B; --ink-2:#3F5A60; --mute:#8FA3A0; --line:#D9E0DE;
    --paper:#F2F4F3; --card:#FFFFFF;
    --ok:#2E7D5B; --warn:#C98A1A; --bad:#C4452E;
    --serif:"Instrument Serif",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
  h1{font:400 22px/1.1 var(--serif);margin:0}
  h2{font:500 13px/1 var(--sans);color:var(--ink-2);margin:28px 0 10px;letter-spacing:0}
  .num{font-variant-numeric:tabular-nums}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:8px 0 4px}
  header button{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:6px 0;cursor:pointer}
  /* week gauge: the one bold element */
  .week{display:grid;grid-template-columns:72px 1fr;gap:18px;align-items:stretch;background:var(--ink);color:#fff;border-radius:18px;padding:18px 18px 16px;min-height:168px}
  .jar{position:relative;border:2px solid rgba(255,255,255,.55);border-top:0;border-radius:0 0 22px 22px;overflow:hidden;background:rgba(255,255,255,.06)}
  .jar::before{content:"";position:absolute;left:-2px;right:-2px;top:0;height:2px;background:rgba(255,255,255,.55)}
  .jar .fill{position:absolute;left:0;right:0;bottom:0;background:#DCE9E4;transition:height .6s cubic-bezier(.2,.8,.2,1)}
  .jar.low .fill{background:#E8B04B}
  .jar.empty .fill{background:#E06A55}
  .week .big{font:400 54px/1 var(--serif);letter-spacing:-.01em;margin:2px 0 4px}
  .week .sub{color:rgba(255,255,255,.72);font-size:14px}
  .week .days{display:flex;gap:4px;margin-top:14px}
  .week .days i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
  .week .days i.past{background:rgba(255,255,255,.7)}
  .week .days i.today{background:#fff}
  .card{background:var(--card);border-radius:14px;padding:4px 14px}
  .row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .l{font-weight:500}
  .row .r{text-align:right;white-space:nowrap}
  .row .m{grid-column:1/-1;color:var(--mute);font-size:13px}
  .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
  .bar b{display:block;height:100%;background:var(--ink-2);border-radius:3px}
  .bar b.warn{background:var(--warn)} .bar b.bad{background:var(--bad)}
  .pct{color:var(--mute);font-size:13px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border-radius:14px;padding:14px}
  .tile .k{color:var(--ink-2);font-size:13px}
  .tile .v{font:400 30px/1.1 var(--serif);margin-top:4px}
  .tile .s{color:var(--mute);font-size:12px;margin-top:4px}
  .tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tx:last-child{border-bottom:0}
  .tx .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .d{color:var(--mute);font-size:13px}
  .tx .a{text-align:right;font-weight:500}
  .tx .p{text-align:right;font-size:13px;color:var(--ink-2)}
  .tx .p.none{color:var(--bad)}
  .tx .a.in{color:var(--ok)}
  .empty{color:var(--mute);padding:14px 0}
  .pill{display:inline-block;font-size:12px;color:var(--ink-2);background:var(--paper);border-radius:999px;padding:2px 8px;margin-left:6px}
  /* sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(23,52,59,.45);display:none;align-items:flex-end;z-index:20}
  .sheet-bg.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
  .sheet h3{margin:4px 0 2px;font:500 16px var(--sans)}
  .sheet .meta{color:var(--mute);font-size:13px;margin-bottom:12px}
  .pots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pots button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
  .pots button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
  /* login */
  .login{max-width:360px;margin:18vh auto 0;padding:0 20px}
  .login h1{font-size:40px;margin-bottom:6px}
  .login p{color:var(--ink-2);margin:0 0 22px}
  .login input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
  .login input:focus,.sheet button:focus-visible,header button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn{width:100%;font:inherit;font-size:16px;font-weight:500;padding:13px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer}
  .btn:disabled{opacity:.6}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1.2em}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){.jar .fill,.toast{transition:none}}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1>Potjes</h1>
  <p id="login-sub">Log in met je e-mailadres en wachtwoord.</p>
  <form id="f-login">
    <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="e-mailadres" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="wachtwoord" required>
    <button class="btn" type="submit">Inloggen</button>
  </form>
  <div id="login-err" class="err"></div>
</div>

<div id="setup" class="login hidden">
  <h1>Potjes</h1>
  <p>Eenmalig: plak de publishable key van je Supabase-project. Die blijft in deze browser staan.</p>
  <form id="f-setup">
    <input id="pkey" type="text" placeholder="sb_publishable_..." required>
    <button class="btn" type="submit">Opslaan</button>
  </form>
</div>

<main id="app" class="hidden">
  <header>
    <h1 id="title">Potjes</h1>
    <button id="refresh" type="button">vernieuwen</button>
  </header>

  <section class="week" aria-label="Leefgeld deze week">
    <div class="jar" id="jar"><div class="fill" id="jar-fill" style="height:0%"></div></div>
    <div>
      <div class="sub" id="week-range">deze week</div>
      <div class="big num" id="week-over">–</div>
      <div class="sub num" id="week-detail"></div>
      <div class="days" id="days"></div>
    </div>
  </section>

  <h2 id="month-title">Deze maand</h2>
  <div class="card" id="pots-month"></div>

  <h2>Opzij gezet</h2>
  <div class="tiles" id="tiles"></div>

  <h2 id="review-title">Nog in te delen</h2>
  <div class="card" id="review"></div>

  <h2>Laatste bij- en afschrijvingen</h2>
  <div class="card" id="recent"></div>
</main>

<div class="sheet-bg" id="sheet-bg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title"></h3>
    <div class="meta" id="sheet-meta"></div>
    <div class="pots" id="sheet-pots"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://oalvkiykvjazcabflwge.supabase.co";
let SUPABASE_KEY = "__PUBLISHABLE_KEY__";
const POT_ORDER = ["boodschappen","brandstof","vrij","vaste_lasten","abonnementen","tijdelijk","buffer","sparen","kinderen","crypto","transfer","negeren","inkomen"];

const $ = (s) => document.querySelector(s);
const eur = (n) => new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const eur2 = (n) => new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(n);
const dateNL = (d) => new Date(d+"T00:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"});
const toast = (m) => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };
const ls = { get:(k)=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

if (SUPABASE_KEY.startsWith("__")) SUPABASE_KEY = ls.get("potjes.key") || "";
let sb = null, pots = [];

function show(id){ for (const s of ["login","setup","app"]) $("#"+s).classList.toggle("hidden", s!==id); }

async function boot(){
  if (!SUPABASE_KEY){ show("setup"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ show("login"); const e=ls.get("potjes.email"); if(e) $("#email").value=e; return; }
  show("app"); await load();
}

$("#f-setup").addEventListener("submit", (e)=>{ e.preventDefault(); SUPABASE_KEY=$("#pkey").value.trim(); ls.set("potjes.key",SUPABASE_KEY); boot(); });

$("#f-login").addEventListener("submit", async (e)=>{
  e.preventDefault(); $("#login-err").textContent="";
  const email=$("#email").value.trim(), password=$("#password").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ $("#login-err").textContent = "Inloggen lukte niet: "+error.message; return; }
  ls.set("potjes.email",email);
  show("app"); await load();
});
$("#refresh").addEventListener("click", load);

async function q(view, opts={}){
  let r = sb.from(view).select("*");
  if (opts.order) r = r.order(opts.order, {ascending:false});
  if (opts.limit) r = r.limit(opts.limit);
  const { data, error } = await r;
  if (error){ if (/JWT|permission|denied|row-level/i.test(error.message)) { toast("Geen toegang: ingelogd met het juiste e-mailadres?"); } throw error; }
  return data;
}

async function load(){
  try{
    const [week, month, tiles, review, recent, potRows] = await Promise.all([
      q("v_week_leefgeld"), q("v_maand_per_pot"), q("v_spaarpotjes"), q("v_te_beoordelen",{limit:30}), q("v_recent",{limit:40}), q("pots")
    ]);
    pots = potRows.sort((a,b)=>POT_ORDER.indexOf(a.id)-POT_ORDER.indexOf(b.id));
    renderWeek(week[0]); renderMonth(month); renderTiles(tiles); renderReview(review); renderRecent(recent);
  }catch(e){ console.error(e); toast("Laden mislukt: "+(e.message||e)); }
}

function renderWeek(w){
  if (!w) return;
  const over = Number(w.over), budget = Number(w.weekbudget), spent = Number(w.uitgegeven);
  const pct = budget>0 ? Math.max(0, Math.min(100, over/budget*100)) : 0;
  const jar = $("#jar"); jar.classList.toggle("low", pct<35 && pct>0); jar.classList.toggle("empty", over<=0);
  $("#jar-fill").style.height = pct+"%";
  $("#week-over").textContent = (over<0?"−":"")+eur(Math.abs(over));
  $("#week-detail").textContent = over<0 ? `${eur(Math.abs(over))} over het weekbudget van ${eur(budget)}` : `over van ${eur(budget)} · ${eur(spent)} uitgegeven`;
  const end = new Date(w.einde+"T00:00:00"), start = new Date(w.start+"T00:00:00"), today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.max(0, Math.round((end-today)/864e5)+1);
  $("#week-range").textContent = `week van ${dateNL(w.start)} t/m ${dateNL(w.einde)} · nog ${daysLeft} ${daysLeft===1?"dag":"dagen"}` + (daysLeft>0 && over>0 ? ` · ${eur(over/daysLeft)} per dag` : "");
  const days = $("#days"); days.innerHTML="";
  for (let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const el=document.createElement("i"); if (d<today) el.className="past"; if (d.getTime()===today.getTime()) el.className="today"; days.appendChild(el); }
}

function renderMonth(rows){
  const ym = new Date().toISOString().slice(0,7);
  const cur = rows.filter(r=>r.maand.startsWith(ym) && r.kind!=="transfer" && r.kind!=="negeren" && r.kind!=="inkomen");
  $("#month-title").textContent = new Date().toLocaleDateString("nl-NL",{month:"long"}).replace(/^./,c=>c.toUpperCase());
  const byId = Object.fromEntries(cur.map(r=>[r.pot_id,r]));
  const list = pots.filter(p=>!["transfer","negeren","inkomen","buffer","sparen"].includes(p.kind) && (p.budget_month>0 || byId[p.id]));
  $("#pots-month").innerHTML = list.map(p=>{
    const r = byId[p.id]; const uit = r?Number(r.uit):0, b = Number(p.budget_month||0);
    const pct = b>0 ? uit/b*100 : 0, cls = pct>100?"bad":pct>85?"warn":"";
    return `<div class="row"><div class="l">${p.label}</div><div class="r num">${eur(uit)}${b?` <span class="pct">van ${eur(b)}</span>`:""}</div>
      ${b?`<div class="bar"><b class="${cls}" style="width:${Math.min(100,pct)}%"></b></div>`:""}</div>`;
  }).join("") || `<div class="empty">Nog geen uitgaven deze maand.</div>`;
}

function renderTiles(rows){
  const find = (role)=>rows.find(r=>r.role===role);
  $("#tiles").innerHTML = ["buffer","sparen"].map(role=>{
    const r = find(role); const v = r?Number(r.saldo_geschat):0;
    return `<div class="tile"><div class="k">${role==="buffer"?"Buffer":"Sparen"}</div><div class="v num">${eur(v)}</div><div class="s">${r&&r.name?"geschat uit overboekingen":"rekening nog niet gekoppeld"}</div></div>`;
  }).join("");
}

function txRow(t, showPot=true){
  const neg = Number(t.amount)<0;
  return `<div class="tx" data-id="${t.id}" data-name="${(t.counterparty_name||"").replace(/"/g,"&quot;")}" data-amount="${t.amount}" data-date="${t.booking_date}" data-pot="${t.pot_id||""}">
    <div class="n">${t.counterparty_name || (t.description||"").slice(0,40) || "onbekend"}</div>
    <div class="a num ${neg?"":"in"}">${neg?"−":"+"}${eur2(Math.abs(Number(t.amount)))}</div>
    <div class="d">${dateNL(t.booking_date)}${t.account_name?` · ${t.account_name}`:""}${t.status==="PDNG"?` <span class="pill">in behandeling</span>`:""}</div>
    ${showPot?`<div class="p ${t.pot_id?"":"none"}">${t.pot_label || (t.pot_id? potLabel(t.pot_id) : "kies potje")}</div>`:""}
  </div>`;
}
const potLabel = (id)=> (pots.find(p=>p.id===id)||{}).label || id;

function renderReview(rows){
  $("#review-title").textContent = rows.length ? `Nog in te delen (${rows.length})` : "Nog in te delen";
  $("#review").innerHTML = rows.length ? rows.map(t=>txRow(t)).join("") : `<div class="empty">Alles is ingedeeld.</div>`;
  bindTx("#review");
}
function renderRecent(rows){
  $("#recent").innerHTML = rows.length ? rows.map(t=>txRow(t)).join("") : `<div class="empty">Nog niets opgehaald. De sync draait elke 4 uur.</div>`;
  bindTx("#recent");
}
function bindTx(sel){ document.querySelectorAll(sel+" .tx").forEach(el=>el.addEventListener("click",()=>openSheet(el.dataset))); }

let current = null;
function openSheet(d){
  current = d;
  $("#sheet-title").textContent = d.name || "Transactie";
  $("#sheet-meta").textContent = `${dateNL(d.date)} · ${eur2(Number(d.amount))}`;
  $("#sheet-pots").innerHTML = pots.map(p=>`<button type="button" data-pot="${p.id}" class="${p.id===d.pot?"sel":""}">${p.label}</button>`).join("");
  $("#sheet-pots").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>setPot(b.dataset.pot)));
  $("#sheet-bg").classList.add("open");
}
$("#sheet-bg").addEventListener("click",(e)=>{ if (e.target.id==="sheet-bg") $("#sheet-bg").classList.remove("open"); });

async function setPot(pot){
  const d = current; $("#sheet-bg").classList.remove("open");
  const { error } = await sb.from("transactions").update({ pot_id:pot, pot_source:"manual", pot_confidence:1 }).eq("id", d.id);
  if (error){ toast("Opslaan mislukt: "+error.message); return; }
  await sb.from("corrections").insert({ transaction_id:d.id, counterparty_name:d.name, amount:Number(d.amount), pot_id:pot });
  toast(`Ingedeeld bij ${potLabel(pot)}`);
  await load();
}

boot();
</script>
</body>
</html>
